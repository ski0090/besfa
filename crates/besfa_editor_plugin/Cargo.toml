[package]
name = "besfa_editor_plugin"
version = "0.1.0"
edition = "2024"
description = "Connects a Bevy game to the Besfa editor"

[dependencies]
bevy = "0.19.1"
# Must match the wgpu and windows versions Bevy's renderer uses, so the raw
# D3D12 types line up with wgpu-hal's.
wgpu = "29"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
