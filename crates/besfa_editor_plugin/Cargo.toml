[package]
name = "besfa_editor_plugin"
version = "0.1.0"
edition = "2024"
description = "Connects a Bevy game to the Besfa editor"

[dependencies]
# `debug` keeps component and system names, which the editor shows.
bevy = { version = "0.20.0", features = ["debug"] }
# Must match the wgpu and windows versions Bevy's renderer uses, so the raw
# D3D12 types line up with wgpu-hal's.
wgpu = "30"
# Commands from the editor and reports to it are JSON lines.
besfa_protocol = { path = "../besfa_protocol" }
# The theme, languages and tree shared with the panels a game draws.
besfa_ui = { path = "../besfa_ui" }
# The game's components and their plugins, which edit mode builds on.
besfa_components = { path = "../besfa_components" }
# Draws the editor's panels into its viewport. No clipboard feature: arboard
# widens `image`, which would rebuild most of Bevy in every game.
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Reads scene files in tests the way Bevy's loader does.
ron = "0.12"
# Clicks through the panels the game draws.
egui_kittest = "0.36"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
