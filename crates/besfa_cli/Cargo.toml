[package]
name = "besfa_cli"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/ski0090/besfa"

[lints]
workspace = true

[dependencies]
besfa_mcp = { path = "../besfa_mcp" }
clap = { version = "4.6.4", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "besfa"
path = "src/main.rs"

# `cargo binstall --git https://github.com/ski0090/besfa besfa_cli` takes
# the besfa.exe that .github/workflows/cli-release.yml builds from main,
# instead of compiling it. Other targets have no build there and compile.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cli-latest/besfa-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "besfa{ binary-ext }"
