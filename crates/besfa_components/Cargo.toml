[package]
name = "besfa_components"
version = "0.1.0"
edition = "2024"
description = "The components a Besfa game ships with: the scene file, terrain, sky and animation state machines"

[dependencies]
bevy = "0.20.0"
# Changes to placed models' parts keep component values as JSON.
serde = "1"
serde_json = "1"

[dev-dependencies]
# Reads scene files in tests the way Bevy's loader does.
ron = "0.12"
