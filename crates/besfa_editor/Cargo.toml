[package]
name = "besfa_editor"
version = "0.1.0"
edition = "2024"
description = "The Besfa editor: project hub and scene editor for Bevy games"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
# Must match the wgpu and windows versions egui-wgpu uses, so the raw D3D12
# types line up with wgpu-hal's when the viewport texture is shared.
wgpu = "29"
serde = { version = "1", features = ["derive"] }
# Keeps component fields in the order the game reports them.
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
# Renders the editor headless for the README's screenshots.
egui_kittest = { version = "0.35", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
