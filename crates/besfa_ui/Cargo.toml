[package]
name = "besfa_ui"
version = "0.1.0"
edition = "2024"
description = "What the Besfa editor and the panels a game draws for it share: the theme, the languages and the tree"

[dependencies]
# The egui both eframe (the editor) and bevy_egui (the game) build on.
egui = { version = "0.36", default-features = false }
# The Inspector shows the components the game reports as JSON.
besfa_protocol = { path = "../besfa_protocol" }
# Plain: `preserve_order` here would widen serde_json in every game. The
# editor asks for it itself, to show fields in the order the game sends.
serde_json = "1"

[dev-dependencies]
# Clicks through the Inspector.
egui_kittest = "0.36"
# With fonts, as in the editor and the game: without them what is typed in a
# field lands before its text.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
# The Inspector's tests name fields by their place, in the order they write
# them. Only tests get this: a game still builds serde_json plain.
serde_json = { version = "1", features = ["preserve_order"] }
